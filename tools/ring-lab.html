<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ring lab</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  /* стенд: изолированное кольцо на однотонном фоне, увеличенное для замера */
  html, body { background: #101820; margin: 0; }
  .lab { padding: 40px; display: flex; gap: 60px; }
  .lab .seat { position: relative; width: 200px; height: 200px; }
  .lab .avatar {
    width: 200px; height: 200px; border-radius: 50%;
    background: #24303c; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font: 64px/1 system-ui, sans-serif;
  }
</style>
</head>
<body>
<div class="lab">
  <div class="seat is-turn" id="s0">
    <div class="avatar">A
      <i class="ring" id="ring">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="trk" cx="50" cy="50" r="45" pathLength="100"></circle>
          <circle class="bar" cx="50" cy="50" r="45" pathLength="100"></circle>
          <circle class="pul" cx="50" cy="50" r="45" pathLength="100"></circle>
        </svg>
      </i>
    </div>
  </div>
</div>
<script>
  var ring = document.getElementById('ring');
  ring.style.setProperty('--ring-dur', '5000ms');
  ring.style.setProperty('--pulse-dur', '1000ms');
  ring.style.setProperty('--pulse-delay', '5000ms');
  ring.style.setProperty('--pulse-count', '5');
  // развёртка: состояния анимаций на сетке времён, одним прогоном
  window.sweep = function (to, step, which) {
    var el = document.querySelector('.lab .' + which);
    var out = [];
    for (var t = 0; t <= to; t += step) {
      el.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t; });
      var cs = getComputedStyle(el);
      out.push({
        t: t,
        dash: parseFloat(cs.strokeDasharray),
        off: parseFloat(cs.strokeDashoffset),
        stroke: cs.stroke,
        opacity: parseFloat(cs.opacity),
      });
    }
    return JSON.stringify(out);
  };

  // замер: сколько видимой дуги (в %) и какой у неё цвет, по данным браузера
  window.measure = function (t) {
    var bar = document.querySelector('.lab .bar');
    var pul = document.querySelector('.lab .pul');
    [bar, pul].forEach(function (el, i) {
      el.getAnimations().forEach(function (a) {
        a.pause(); a.currentTime = t;
      });
    });
    var cs = getComputedStyle(bar);
    var cp = getComputedStyle(pul);
    var box = document.getElementById('ring').getBoundingClientRect();
    return JSON.stringify({
      t: t,
      centre: [box.x + box.width / 2, box.y + box.height / 2],
      box: [box.width, box.height],
      barDash: cs.strokeDasharray, barOffset: cs.strokeDashoffset,
      barStroke: cs.stroke, barOpacity: cs.opacity,
      pulOpacity: cp.opacity, pulStroke: cp.stroke,
    });
  };
</script>
</body>
</html>
